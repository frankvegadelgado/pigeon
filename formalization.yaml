version: v0.4
project:
  name: "PigeonGoldbach: nested squares and distinct-prime Goldbach partitions"
  description: "Lean 4 formalization of the elementary statements of the paper 'Nested Squares and Distinct-Prime Goldbach Partitions'. The compared results are: the geometric equivalence of a distinct-prime Goldbach partition of 2N, a centered pair N - M, N + M of primes with M in [1, N - 3], and a semiprime L-shaped area N^2 - M^2 (Theorem thm:geometric); the centered intersection criterion C_N ∩ D_N nonempty (Proposition prop:intersection); the inclusion C_N ∩ D_N ⊆ E_N into the half-difference set (Lemma lem:CD-in-E); the parity class of C_N and D_N; the gap obstructions of Lemmas lem:gap and lem:gap-top; the pigeonhole step of Proposition prop:pigeonhole-CE; the count |C_N| of primes 3 <= P <= N - 1; the baseline supply of half-differences of Corollary cor:half-difference-baseline; the shift form of Corollary cor:goldbach-diff; the step of Proposition prop:verified from a partition with p < N to an element of C_N ∩ D_N; the criterion H(N) > 0 for the coverage statistic and the Cramer-type bound p' - p < 2 log^2(2p + 2) + 2 for consecutive primes when H(p + 1) > 0 (Theorem thm:cramer), together with the counting form of Corollary cor:long-gaps; the counting steps of Corollary cor:goldbach-diff; and the small cases N = 4, ..., 12. For Theorem thm:positive-proportion (more than X/2382 integers N <= X with 2N a sum of two distinct primes, for every X >= 10^6) it formalizes the combinatorial part of the method: the Cauchy-Schwarz bound T^2 <= (number of N with R(2N) >= 1) * V, the lower bound of T by the number of pairs of odd primes p < q <= X, the count of such pairs, the bound of V by the number of quadruples (p, q, p', q') of odd primes with p, p' <= X, q, q' <= 2X and p + q = p' + q', the lower bound T > (s - 2)^2/2 with s = X/log X from the cited Rosser-Schoenfeld bound, and the conditional form of the theorem with explicit bounds on T and V as hypotheses. The cited results are stated as explicit hypotheses in a separate module, as in the Paloma formalization: Siebert's sieve bound, the bounds of Dusart and of Rosser and Schoenfeld, and the verification of the even Goldbach conjecture up to 4e18, from which Proposition prop:verified is proved. The analytic results (Mikawa's theorem, Siebert's sieve bound, the proofs of the explicit prime-counting estimates, the energy bound, the numerical constants of Theorem thm:positive-proportion and the computations) are not formalized."
